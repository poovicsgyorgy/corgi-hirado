<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corgi Híradó</title>
<meta name="description" content="Napi corgis hírek magyarul, újság formában.">
<meta name="theme-color" content="#f4efe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corgi Híradó">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --paper: #f4efe4;
    --ink: #1d1a16;
    --muted: #6b6257;
    --rule: #1d1a16;
    --accent: #b5521b;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --display: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1b1915; --ink: #ece5d8; --muted: #a39a8c; --rule: #ece5d8; --accent: #e08a4f; }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: var(--serif); line-height: 1.5;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }

  /* Fejléc */
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 12px; color: var(--muted);
    padding: 12px 0 8px; text-transform: uppercase; letter-spacing: .06em;
  }
  .topbar select, .topbar button {
    font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--muted); border-radius: 4px; padding: 4px 8px; text-transform: none;
  }
  .masthead { text-align: center; border-bottom: 4px double var(--rule); padding-bottom: 6px; }
  .masthead h1 {
    font-family: var(--display); font-weight: 700; margin: 4px 0 0;
    font-size: clamp(42px, 12vw, 96px); line-height: 1; letter-spacing: -.01em;
  }
  .masthead .motto { font-style: italic; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .dateline {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px;
    border-bottom: 1px solid var(--rule); padding: 6px 0; margin-bottom: 18px;
    font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  }

  /* Vezércikk */
  .lead { display: grid; gap: 18px; border-bottom: 1px solid var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  @media (min-width: 760px) { .lead.has-img { grid-template-columns: 1.3fr 1fr; align-items: start; } }
  .lead h2 { font-family: var(--display); font-size: clamp(28px, 6vw, 46px); line-height: 1.08; margin: 6px 0 10px; }
  .lead p { font-size: 18px; margin: 0 0 10px; }
  .lead img { width: 100%; aspect-ratio: 4/3; object-fit: cover; filter: grayscale(.25) contrast(1.05); border: 1px solid var(--rule); }

  .kicker { font-family: var(--sans); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
  .meta { font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .orig { font-size: 13px; color: var(--muted); font-style: italic; margin: 4px 0 8px; }
  a { color: inherit; }
  a.title { text-decoration: none; }
  a.title:hover { text-decoration: underline; }
  .more { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }

  /* Hasábok */
  .columns { column-gap: 28px; column-rule: 1px solid color-mix(in srgb, var(--rule) 35%, transparent); }
  @media (min-width: 640px) { .columns { columns: 2; } }
  @media (min-width: 980px) { .columns { columns: 3; } }
  .story { break-inside: avoid; padding: 0 0 16px; margin: 0 0 16px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 25%, transparent); }
  .story h3 { font-size: 21px; line-height: 1.2; margin: 4px 0 6px; }
  .story p { margin: 0 0 6px; font-size: 16px; }
  .story img { width: 100%; aspect-ratio: 16/9; object-fit: cover; margin: 6px 0 4px; filter: grayscale(.25); }
  .columns .story:first-of-type p:first-of-type::first-letter {
    font-family: var(--display); float: left; font-size: 3.1em; line-height: .85; padding: 4px 6px 0 0;
  }

  .empty, .status { text-align: center; font-style: italic; color: var(--muted); padding: 40px 0; }
  footer { margin-top: 28px; border-top: 4px double var(--rule); padding-top: 10px; text-align: center; font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .install { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span id="updated">Betöltés…</span>
    <span>
      <select id="edition" aria-label="Lapszám választása"></select>
      <button id="refresh" aria-label="Frissítés">↻</button>
      <button id="install" class="install">Telepítés</button>
    </span>
  </div>

  <header class="masthead">
    <h1>Corgi Híradó</h1>
    <div class="motto">„Rövid lábak, nagy hírek” — a világ corgis hírei, minden reggel magyarul</div>
  </header>
  <div class="dateline">
    <span id="dayname"></span>
    <span id="issue"></span>
    <span id="count"></span>
  </div>

  <main id="paper"><div class="status">A lapszám betöltése…</div></main>

  <footer>
    A hírek automatikusan, minden reggel 6:00-kor frissülnek. A fordítás gépi; a teljes cikkek az eredeti forrásoknál olvashatók.
  </footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const fmtDay = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("hu-HU", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
const fmtTime = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("hu-HU", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const LANG = { en: "angol", de: "német", fr: "francia", es: "spanyol", it: "olasz", ja: "japán", hu: "magyar" };

async function getJSON(path, fresh) {
  const r = await fetch(path + (fresh ? "?t=" + Date.now() : ""), { cache: fresh ? "no-store" : "default" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function img(a, cls) {
  const u = safeUrl(a.image);
  return u ? `<img class="${cls||""}" src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
}

function storyMeta(a) {
  return `<div class="meta">${esc(a.source)}${a.published ? " · " + esc(fmtTime(a.published)) : ""}${a.lang && a.lang !== "hu" ? " · fordítva " + esc(LANG[a.lang] || a.lang) + " nyelvből" : ""}</div>`;
}

function render(ed) {
  const arts = ed.articles || [];
  $("#dayname").textContent = fmtDay(ed.date);
  $("#count").textContent = arts.length + " cikk";
  const start = new Date("2026-11-16");
  const n = Math.max(1, Math.round((new Date(ed.date) - start) / 864e5) + 1);
  $("#issue").textContent = `I. évfolyam, ${n}. szám`;
  $("#updated").textContent = "Frissítve: " + fmtTime(ed.generated_at);

  if (!arts.length) {
    $("#paper").innerHTML = `<div class="empty">Ma csend van a corgik háza táján — nem érkezett új hír.</div>`;
    return;
  }
  // Vezércikk: az első, amelyiknek van leírása (lehetőleg képe is)
  let li = arts.findIndex(a => a.summary_hu && a.image);
  if (li < 0) li = arts.findIndex(a => a.summary_hu);
  if (li < 0) li = 0;
  const lead = arts[li];
  const rest = arts.filter((_, i) => i !== li);
  const link = esc(safeUrl(lead.link));

  let h = `<article class="lead ${safeUrl(lead.image) ? "has-img" : ""}">
    <div>
      <div class="kicker">${esc(lead.category)}</div>
      <h2><a class="title" href="${link}" target="_blank" rel="noopener">${esc(lead.title_hu || lead.title)}</a></h2>
      ${lead.lang !== "hu" ? `<div class="orig">Eredeti cím: ${esc(lead.title)}</div>` : ""}
      ${lead.summary_hu ? `<p>${esc(lead.summary_hu)}</p>` : ""}
      ${storyMeta(lead)}
      <p><a class="more" href="${link}" target="_blank" rel="noopener">Tovább az eredeti cikkhez →</a></p>
    </div>
    ${img(lead)}
  </article><section class="columns">`;

  for (const a of rest) {
    const l = esc(safeUrl(a.link));
    h += `<article class="story">
      <div class="kicker">${esc(a.category)}</div>
      <h3><a class="title" href="${l}" target="_blank" rel="noopener">${esc(a.title_hu || a.title)}</a></h3>
      ${img(a)}
      ${a.summary_hu ? `<p>${esc(a.summary_hu)}</p>` : ""}
      ${storyMeta(a)}
    </article>`;
  }
  $("#paper").innerHTML = h + "</section>";
}

async function load(date, fresh) {
  try {
    const ed = await getJSON(date ? `data/${date}.json` : "data/latest.json", fresh);
    render(ed);
    window.scrollTo(0, 0);
  } catch (e) {
    $("#paper").innerHTML = `<div class="status">Még nincs elérhető lapszám. Az első szám a következő reggel 6:00-kor jelenik meg.</div>`;
    $("#updated").textContent = "Nincs adat";
  }
}

async function loadIndex(fresh) {
  try {
    const idx = await getJSON("data/index.json", fresh);
    const sel = $("#edition");
    sel.innerHTML = idx.editions.map((d, i) =>
      `<option value="${i === 0 ? "" : esc(d)}">${i === 0 ? "Mai szám" : esc(d)}</option>`).join("");
  } catch (e) { $("#edition").style.display = "none"; }
}

$("#edition").addEventListener("change", e => load(e.target.value, false));
$("#refresh").addEventListener("click", () => { loadIndex(true); load($("#edition").value, true); });

// Ha az app reggel háttérből előjön, töltse újra a friss számot
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !$("#edition").value) load("", true);
});

// Telepítés gomb (Android / Chrome)
let deferred;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#install").style.display = "inline-block"; });
$("#install").addEventListener("click", async () => { if (deferred) { deferred.prompt(); deferred = null; $("#install").style.display = "none"; } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

loadIndex(true);
load("", true);
</script>
</body>
</html>
